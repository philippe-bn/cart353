<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        canvas {
            display: block;
            border-radius: 28px;
            background: #0f1219;
            width: min(96vw, 96vh);
            height: min(96vw, 96vh);
            max-width: 800px;
            max-height: 800px;
            cursor: crosshair;
            aspect-ratio: 1/1;
            /* mix-blend-mode: difference; // tried this for additive blending... */
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <script>
        (function() {

            const canvas = document.getElementById('particleCanvas');
            const context = canvas.getContext('2d');
            // const gl = canvas.getContext('gl');

            const GRAVITY = 0.09;

            const rand = (min,max) => Math.random() * (max-min) + min;

            let particles = [];

            function spawnParticle() {
                const x = canvas.width / 2 + rand(-15, 15);
                const y = rand(70, 80);
                
                const radius = rand(1.25, 3.75);

                const vx = rand(-2.2, 2,2);
                const vy = rand(-4.5, 0.2);

                const hue = rand(28, 48);
                const sat = rand(80, 100);
                const light = rand(55, 75);

                const lifetime = rand(70, 180);

                particles.push({
                    x,y,
                    vx, vy,
                    radius,
                    hue,
                    sat,
                    light,
                    life: lifetime,
                    maxLife: lifetime,
                })
            }

            function updateParticles() {
                for (let i = particles.length -1; i >= 0; i--) {
                    const p = particles[i];

                    // apply gravity
                    p.vy += GRAVITY;
                    
                    // update position with velocity
                    p.x += p.vx; // IMPORTANT IN PHYSICS: multiply according to refresh rate to uniformize simulation (each refresh is a time "step" so shorter steps = faster)
                    p.y += p.vy;

                    // drag
                    p.vx *= 0.998;
                    p.vy *= 0.998;

                    // decrease lifetime
                    p.life--;
                    
                    // check if dead
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }


                }
            }

            function draw() {
                context.clearRect(0,0,canvas.width,canvas.height);

                // blendMode(ADD); realized this is a p5 function so trying a workaround
                // let gl = WebGL2RenderingContext;
                // gl.enable(gl.BLEND);
                // gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
                
                for (const p of particles) {
                    // const color = 'hsla(${p.hue}, ${p.sat}%, ${p.light}%, 0.8)' //not working
                    const color = 'hsla(240, 100%, 90%, 0.8)'

                    context.beginPath();
                    context.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    context.fillStyle = color;
                    context.fill();
                }
            }

            // MAIN loop
            function loop() {
                for(let s = 0; s < 8; s++) {
                    if (particles.length < 2000) {
                        spawnParticle();
                    }
                    else {
                        break;
                    }
                }

                updateParticles();
                
                draw();

                requestAnimationFrame(loop);
            }

            loop();
        })();
    </script>
</body>

</html>
